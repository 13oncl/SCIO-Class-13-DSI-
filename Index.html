<!DOCTYPE html>
<html lang="th">
  <head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ทำเนียบรุ่น พสพ.13</title>
    <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/6/6f/Seal_of_the_Department_of_Special_Investigation.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
      :root { --primary-color: #1e3c72; --secondary-color: #2a5298; --bg-color: #f8f9fa; }
      body { font-family: 'Sarabun', sans-serif; background-color: var(--bg-color); color: #333; }
      
      .header-bg {
        background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
        color: white; padding: 30px 15px 80px; border-radius: 0 0 30px 30px;
        position: relative; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      }
      .logo-img { height: 70px; width: auto; display: block; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3)); margin: 0 auto 10px; }
      
      .search-wrapper { position: sticky; top: 0; z-index: 1020; padding: 10px 15px; margin-top: -60px; }
      .search-box { max-width: 600px; margin: 0 auto; background: rgba(255,255,255,0.85); backdrop-filter: blur(12px); padding: 15px; border-radius: 20px; box-shadow: 0 8px 32px rgba(31,38,135,0.15); }
      .search-input { border-radius: 50px; padding: 12px 25px; border: 1px solid #e0e0e0; width: 100%; font-size: 1.1rem; }
      .search-input:focus { outline: none; border-color: var(--secondary-color); box-shadow: 0 0 0 4px rgba(42,82,152,0.1); }

      .dept-header { display: flex; align-items: center; margin: 30px 0 15px; padding-bottom: 8px; border-bottom: 2px solid #e9ecef; }
      .dept-title { color: var(--primary-color); font-weight: 700; font-size: 1.3rem; margin-right: 10px; }
      .dept-badge { background-color: var(--secondary-color); color: white; padding: 2px 10px; border-radius: 12px; font-size: 0.8rem; }

      .member-card { background: white; border-radius: 16px; padding: 20px; height: 100%; box-shadow: 0 2px 8px rgba(0,0,0,0.04); position: relative; display: flex; flex-direction: column; justify-content: space-between; transition: 0.2s; }
      .member-card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px rgba(0,0,0,0.08); }
      .edit-icon { position: absolute; top: 15px; right: 15px; color: #ced4da; cursor: pointer; z-index: 5; }
      .edit-icon:hover { color: var(--secondary-color); transform: scale(1.1); }

      .member-name { font-size: 1.15rem; font-weight: 700; color: var(--primary-color); margin-bottom: 2px; padding-right: 20px; }
      .member-nick { font-weight: 400; font-size: 0.9em; color: #666; }
      .member-pos { color: #6c757d; font-size: 0.9rem; margin-bottom: 10px; }
      .bd-badge { font-size: 0.75rem; background-color: #fff3cd; color: #856404; padding: 2px 8px; border-radius: 10px; display: inline-block; margin-top: 5px; }

      .card-footer-custom { border-top: 1px solid #f1f3f5; padding-top: 12px; display: flex; justify-content: flex-end; gap: 8px; margin-top: 15px; }
      .btn-icon { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; transition: 0.2s; }
      .btn-phone { background: #f0f7ff; color: #0d6efd; } .btn-line { background: #f0fff4; color: #198754; } .btn-email { background: #fff8f0; color: #fd7e14; }
      .btn-icon:hover { transform: scale(1.1); filter: brightness(0.95); }

      .fab-add { position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; background: var(--primary-color); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 4px 20px rgba(30,60,114,0.4); cursor: pointer; z-index: 2000; transition: transform 0.3s; }
      .fab-add:hover { transform: scale(1.1) rotate(90deg); background: var(--secondary-color); }
      
      .loader { border: 4px solid #f3f3f3; border-top: 4px solid var(--primary-color); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 40px auto; }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
  </head>
  <body>

    <div class="header-bg text-center">
      <div class="container">
        <img src="https://www.dsi.go.th/images/logo-text-dsi.png" alt="DSI Logo" class="logo-img">
        <h3 class="fw-bold mb-0 text-white">ทำเนียบรุ่น พสพ.13</h3>
        <small class="text-white-50">DSI - Special Case Inquiry Official - Class 13</small>
      </div>
    </div>

    <div class="search-wrapper">
      <div class="search-box">
        <div class="position-relative">
          <i class="fas fa-search position-absolute text-muted" style="left: 15px; top: 14px;"></i>
          <input type="text" id="searchInput" class="search-input ps-5" placeholder="ค้นหา ชื่อ, ชื่อเล่น, หรือเบอร์โทร..." onkeyup="filterData()">
        </div>
      </div>
    </div>

    <div class="container pb-5" style="margin-top: 20px;">
      <div id="loader" class="loader"></div>
      <div id="contentArea"></div>
      <div id="noResults" class="text-center mt-5" style="display:none;">
        <h5 class="text-muted">ไม่พบข้อมูล</h5>
      </div>
    </div>

    <div class="fab-add" onclick="openModal()" title="เพิ่มรายชื่อ"><i class="fas fa-plus"></i></div>

    <div class="modal fade" id="dataModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content border-0 shadow-lg">
          <div class="modal-header bg-light">
            <h5 class="modal-title fw-bold" id="modalTitle">จัดการข้อมูล</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body p-4">
            <form id="memberForm" onsubmit="handleFormSubmit(event)">
              <input type="hidden" id="recId" name="recId">
              <div class="row g-3">
                <div class="col-12 col-md-8">
                  <label class="form-label small fw-bold text-muted">ชื่อ-นามสกุล *</label>
                  <input type="text" class="form-control" id="name" name="name" required>
                </div>
                <div class="col-12 col-md-4">
                  <label class="form-label small fw-bold text-muted">ชื่อเล่น</label>
                  <input type="text" class="form-control" id="nickname" name="nickname">
                </div>
                <div class="col-12 col-md-6">
                  <label class="form-label small fw-bold text-muted">ตำแหน่ง</label>
                  <input type="text" class="form-control" id="position" name="position" value="พนักงานสอบสวนคดีพิเศษชำนาญการ">
                </div>
                <div class="col-12 col-md-6">
                  <label class="form-label small fw-bold text-muted">สังกัด (ตัวย่อ/หน่วยงาน)</label>
                  <select class="form-select" id="dept" name="dept" required>
                    <option value="" selected disabled>-- เลือกสังกัด --</option>
                    </select>
                </div>
                <div class="col-12 col-md-4">
                   <label class="form-label small fw-bold text-muted">วันเดือนปีเกิด</label>
                   <input type="date" class="form-control" id="birthdate" name="birthdate">
                </div>
              </div>
              <div class="bg-light p-3 rounded mt-4 border">
                <label class="d-block small fw-bold text-primary mb-2">ช่องทางติดต่อ</label>
                <div class="row g-3">
                  <div class="col-12 col-md-4">
                    <input type="tel" class="form-control" id="phone" name="phone" placeholder="เบอร์โทรศัพท์">
                  </div>
                  <div class="col-12 col-md-4">
                    <input type="text" class="form-control" id="lineId" name="lineId" placeholder="Line ID">
                  </div>
                  <div class="col-12 col-md-4">
                    <input type="email" class="form-control" id="email" name="email" placeholder="E-mail">
                  </div>
                </div>
              </div>
              <div class="d-flex gap-2 mt-4 pt-2">
                <button type="button" id="btnDelete" class="btn btn-outline-danger" onclick="deleteMember()" style="display:none;">ลบ</button>
                <button type="submit" id="btnSave" class="btn btn-primary flex-grow-1 rounded-pill">บันทึกข้อมูล</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      let allData = [];
      let dataModal;

      // รายชื่อสังกัดสำหรับ Dropdown
      const deptOptions = [
        "สำนักงานอธิบดีกรมสอบสวนคดีพิเศษ (สนง.อสพ.)",
        "สำนักงานรองอธิบดีกรมสอบสวนคดีพิเศษ (สนง.รองฯ 1)",
        "สำนักงานรองอธิบดีกรมสอบสวนคดีพิเศษ (สนง.รองฯ 2)",
        "สำนักงานรองอธิบดีกรมสอบสวนคดีพิเศษ (สนง.รองฯ 3)",
        "สำนักงานรองอธิบดีกรมสอบสวนคดีพิเศษ (สนง.รองฯ 4)",
        "สำนักงานผู้เชี่ยวชาญเฉพาะด้านคดีพิเศษ (สนง.ชช)",
        "กองกิจการต่างประเทศและคดีอาชญกรรมระหว่างประเทศ (กตท.)",
        "กองคดีเทคโนโลยีและสารสนเทศ (กคท.)",
        "กองคดีการเงินการธนาคารและการฟอกเงิน (กคง.)",
        "กองคดีความมั่นคง (กมค.)",
        "กองคดีทรัพยากรธรรมชาติและสิ่งแวดล้อม (กคส.)",
        "กองคดีทรัพย์สินทางปัญญา (กคป.)",
        "กองคดีภาษีอากร (กคภ.)",
        "กองปฏิบัติการคดีพิเศษภาค (กปภ.)",
        "กองเทคโนโลยีและศูนย์ข้อมูลการตรวจสอบ (กทศ.)",
        "กองนโยบายและยุทธศาสตร์ (กนย.)",
        "กองคดีธุรกิจการเงินนอกระบบ (กคธ.)",
        "กองคดีความผิดเกี่ยวกับการเสนอราคาต่อหน่วยงานของรัฐ (กคร.)",
        "กองคดีคุ้มครองผู้บริโภค (กคบ.)",
        "กองปฏิบัติการพิเศษ (กปพศ.)",
        "สำนักงานเลขานุการกรม (สลก.)",
        "กองพัฒนาและสนับสนุนคดีพิเศษ (กพน.)",
        "กองกฎหมาย (กกม.)",
        "กองบริหารคดีพิเศษ (กบพ.)",
        "กองคดีการค้ามนุษย์ (กคม.)",
        "ศูนย์สืบสวนสะกดรอยและการข่าว",
        "กลุ่มบริหารทรัพยากรบุคคล (กบค.)",
        "กลุ่มค่าใช้จ่ายคดีพิเศษ (กงพ.)",
        "กลุ่มตรวจสอบภายใน (กตน.)",
        "กลุ่มพัฒนาระบบบริหาร (กพร.)",
        "สำนักงานสหวิทยาการคดีพิเศษ",
        "ศูนย์ช่วยเหลือลูกหนี้และประชาชนที่ไม่ได้รับความเป็นธรรม",
        "กองกิจการอำนวยความยุติธรรม",
        "ศูนย์ป้องกันและปราบปรามการฟอกเงินทางอาญา",
        "ศูนย์คดีละเมิดทางเพศเด็ก",
        "กองคดียาเสพติด",
        "ศูนย์ปฏิบัติการคดีพิเศษเขตพื้นที่ 1 (อยุธยา)",
        "ศูนย์ปฏิบัติการคดีพิเศษเขตพื้นที่ 2 (ชลบุรี)",
        "ศูนย์ปฏิบัติการคดีพิเศษเขตพื้นที่ 3 (นครราชสีมา)",
        "ศูนย์ปฏิบัติการคดีพิเศษเขตพื้นที่ 4 (ขอนแก่น)",
        "ศูนย์ปฏิบัติการคดีพิเศษเขตพื้นที่ 5 (เชียงใหม่)",
        "ศูนย์ปฏิบัติการคดีพิเศษเขตพื้นที่ 6 (พิษณุโลก)",
        "ศูนย์ปฏิบัติการคดีพิเศษเขตพื้นที่ 7 (ราชบุรี)",
        "ศูนย์ปฏิบัติการคดีพิเศษเขตพื้นที่ 8 (สุราษฎร์ธานี)",
        "ศูนย์ปฏิบัติการคดีพิเศษเขตพื้นที่ 9 (สงขลา)",
        "ศูนย์ปฏิบัติการคดีพิเศษเขตพื้นที่ 10 (ชายแดนภาคใต้)"
      ];

      window.onload = function() {
        dataModal = new bootstrap.Modal(document.getElementById('dataModal'));
        populateDeptDropdown(); // สร้างตัวเลือก Dropdown
        fetchData();
        
        document.getElementById('phone').addEventListener('input', function (e) {
            let x = e.target.value.replace(/\D/g, '').match(/(\d{0,3})(\d{0,3})(\d{0,4})/);
            e.target.value = !x[2] ? x[1] : x[1] + '-' + x[2] + (x[3] ? '-' + x[3] : '');
        });
      };

      // ฟังก์ชันสำหรับสร้าง Option ใน Dropdown
      function populateDeptDropdown() {
        const select = document.getElementById('dept');
        deptOptions.forEach(opt => {
          const option = document.createElement('option');
          option.value = opt;
          option.text = opt;
          select.appendChild(option);
        });
      }

      function fetchData() {
        document.getElementById('loader').style.display = 'block';
        document.getElementById('contentArea').innerHTML = '';
        
        google.script.run
          .withSuccessHandler(showData)
          .withFailureHandler(function(err){
             document.getElementById('loader').style.display = 'none';
             Swal.fire('Error', 'ไม่สามารถดึงข้อมูลได้: ' + err.message, 'error');
          })
          .getData();
      }

      function showData(data) {
        allData = data.filter(r => r[0] && r[0] !== "");
        try {
          renderData(allData);
          checkBirthdayToday(allData);
        } catch(e) {
          console.error(e);
          Swal.fire('Error', 'เกิดข้อผิดพลาดในการแสดงผล', 'error');
        }
        document.getElementById('loader').style.display = 'none';
      }

      function renderData(data) {
        const container = document.getElementById('contentArea');
        container.innerHTML = '';
        
        if (data.length === 0) {
          document.getElementById('noResults').style.display = 'block'; return;
        } else {
          document.getElementById('noResults').style.display = 'none';
        }

        const groups = {};
        data.forEach(row => {
          let dept = row[4] ? row[4].toString().trim() : 'ไม่ระบุสังกัด';
          if(dept === "") dept = 'ไม่ระบุสังกัด';
          if(!groups[dept]) groups[dept] = [];
          groups[dept].push(row);
        });

        const sortedDepts = Object.keys(groups).sort((a,b) => a.localeCompare(b, 'th'));
        let html = '';

        sortedDepts.forEach(dept => {
          const members = groups[dept];
          members.sort((a,b) => (a[1]||"").localeCompare((b[1]||""), 'th'));

          html += `<div class="dept-header"><span class="dept-title">${dept}</span><span class="dept-badge">${members.length}</span></div><div class="row g-3 mb-4">`;

          members.forEach(row => {
            const [id, name, nickname, position, d, phone, line, email, birthdate] = row;
            const displayNick = nickname ? `<span class="member-nick">(${nickname})</span>` : '';
            
            let bdDisplay = '';
            if(birthdate) {
                const bd = new Date(birthdate);
                if(!isNaN(bd.getTime())) {
                    const months = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
                    bdDisplay = `<div class="bd-badge"><i class="fas fa-birthday-cake me-1"></i>${bd.getDate()} ${months[bd.getMonth()]} ${bd.getFullYear()+543}</div>`;
                }
            }

            let btns = '';
            if(phone) btns += `<a href="tel:${phone}" class="btn-icon btn-phone"><i class="fas fa-phone"></i></a>`;
            if(line) btns += `<a href="https://line.me/ti/p/~${line}" target="_blank" class="btn-icon btn-line"><i class="fab fa-line"></i></a>`;
            if(email) btns += `<a href="mailto:${email}" class="btn-icon btn-email"><i class="fas fa-envelope"></i></a>`;

            html += `
              <div class="col-12 col-md-6 col-lg-4">
                <div class="member-card">
                  <div class="edit-icon" onclick="openModal('${id}')"><i class="fas fa-pen"></i></div>
                  <div>
                    <div class="member-name">${name} ${displayNick}</div>
                    <div class="member-pos">${position || '-'}</div>
                    ${bdDisplay}
                  </div>
                  <div class="card-footer-custom">${btns || '<small class="text-muted small">ไม่มีข้อมูลติดต่อ</small>'}</div>
                </div>
              </div>`;
          });
          html += `</div>`;
        });
        container.innerHTML = html;
      }

      function checkBirthdayToday(data) {
          const today = new Date();
          const currentDay = today.getDate();
          const currentMonth = today.getMonth() + 1;
          let birthdayList = [];

          data.forEach(row => {
              if (row[8]) {
                  const bdDate = new Date(row[8]);
                  if (!isNaN(bdDate) && bdDate.getDate() === currentDay && (bdDate.getMonth() + 1) === currentMonth) {
                      birthdayList.push(`${row[1]} (${row[2] || '-'})`);
                  }
              }
          });

          if (birthdayList.length > 0) {
              let htmlList = `<ul class="text-start mt-2">` + birthdayList.map(n => `<li>${n}</li>`).join('') + `</ul>`;
              Swal.fire({
                  title: '🎂 Happy Birthday!',
                  html: `สุขสันต์วันเกิด:<br>${htmlList}`,
                  icon: 'info',
                  confirmButtonText: 'ปิด',
                  backdrop: `rgba(0,0,123,0.4)`
              });
          }
      }

      function filterData() {
        const input = document.getElementById('searchInput').value.toLowerCase();
        const filtered = allData.filter(row => {
            const txt = ((row[1]||"")+(row[2]||"")+(row[3]||"")+(row[4]||"")+(row[5]||"")).toLowerCase();
            return txt.includes(input);
        });
        renderData(filtered);
      }

      function openModal(id = null) {
        document.getElementById('memberForm').reset();
        const deleteBtn = document.getElementById('btnDelete');
        
        if(id) {
          document.getElementById('modalTitle').innerText = 'แก้ไขข้อมูล';
          document.getElementById('recId').value = id;
          deleteBtn.style.display = 'block';

          const item = allData.find(r => r[0] == id);
          if(item) {
            document.getElementById('name').value = item[1];
            document.getElementById('nickname').value = item[2];
            document.getElementById('position').value = item[3];
            
            // ตั้งค่า Dropdown ให้ตรงกับข้อมูลที่มี
            // ถ้าข้อมูลเดิมในชีทไม่ตรงกับตัวเลือกใน List เป๊ะๆ (เช่น ไม่มีวงเล็บ) อาจจะเลือกไม่ได้ 
            // แต่เมื่อกดบันทึกใหม่ จะถูกทับด้วยค่าใหม่จาก Dropdown ทันที
            document.getElementById('dept').value = item[4]; 
            
            document.getElementById('phone').value = item[5] ? item[5].toString().replace(/'/g,'') : '';
            document.getElementById('lineId').value = item[6];
            document.getElementById('email').value = item[7];
            if(item[8]) {
                const d = new Date(item[8]);
                if(!isNaN(d)) {
                    const yyyy = d.getFullYear();
                    const mm = String(d.getMonth() + 1).padStart(2, '0');
                    const dd = String(d.getDate()).padStart(2, '0');
                    document.getElementById('birthdate').value = `${yyyy}-${mm}-${dd}`;
                }
            }
          }
        } else {
          document.getElementById('modalTitle').innerText = 'เพิ่มสมาชิกใหม่';
          document.getElementById('recId').value = "";
          document.getElementById('position').value = "พนักงานสอบสวนคดีพิเศษชำนาญการ";
          document.getElementById('dept').value = ""; // รีเซ็ต Dropdown
          deleteBtn.style.display = 'none';
        }
        dataModal.show();
      }

      function handleFormSubmit(e) {
        e.preventDefault();
        const btn = document.getElementById('btnSave');
        const orgText = btn.innerHTML;
        btn.disabled = true; btn.innerHTML = 'กำลังบันทึก...';

        const form = document.getElementById('memberForm');
        const formData = {
          recId: form.recId.value,
          name: form.name.value,
          nickname: form.nickname.value,
          position: form.position.value,
          dept: form.dept.value, // รับค่าจาก Select
          phone: form.phone.value,
          lineId: form.lineId.value,
          email: form.email.value,
          birthdate: form.birthdate.value
        };

        google.script.run.withSuccessHandler(res => {
          dataModal.hide();
          btn.disabled = false; btn.innerHTML = orgText;
          Swal.fire({ icon: 'success', title: 'เรียบร้อย', text: res, timer: 1500, showConfirmButton: false });
          fetchData();
        }).saveData(formData);
      }

      function deleteMember() {
        const id = document.getElementById('recId').value;
        Swal.fire({
          title: 'ยืนยันการลบ?', icon: 'warning', showCancelButton: true, confirmButtonColor: '#dc3545', confirmButtonText: 'ลบข้อมูล'
        }).then((result) => {
          if (result.isConfirmed) {
            google.script.run.withSuccessHandler(res => {
               dataModal.hide();
               Swal.fire('ลบสำเร็จ!', '', 'success');
               fetchData();
            }).deleteData(id);
          }
        });
      }
    </script>
  </body>
</html>
